services:
  db:
    image: postgres:16-alpine
    container_name: aistos-debts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aistos
      POSTGRES_PASSWORD: aistos
      POSTGRES_DB: debts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aistos -d debts"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: aistos-debts-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI + REST API

volumes:
  pgdata: